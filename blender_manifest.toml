schema_version = "1.0.0"

id = "halcyon_render"
version = "1.32.0"
name = "Halcyon Render Engine"
tagline = "Period-accurate mid-to-late 1990s CGI, not a filter"
maintainer = "Built by Claude with help from Mr. Emotiman <your@email.address>"
type = "add-on"

tags = ["Render", "Material", "Node"]

blender_version_min = "5.1.0"

license = ["SPDX:GPL-3.0-or-later"]

# website = "https://example.com/halcyon"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.zip",
  "/tests/",
  "/docs/",
  "/EXTENSION_LISTING.md",
  "/CHANGELOG.md",
]

[permissions]
files = "Reads image textures and shader source from text datablocks"
