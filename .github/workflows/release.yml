name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: halcyon
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy
      - name: The suite must pass before anything ships
        run: python -m halcyon.tests.run_all
      - name: Check the tag matches the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAN=$(grep -m1 '^version' halcyon/blender_manifest.toml | cut -d'"' -f2)
          echo "tag $TAG, manifest $MAN"
          test "$TAG" = "$MAN"
      - name: Build the add-on zip
        run: |
          cd halcyon
          rm -rf .git .github
          find . -name '__pycache__' -type d -exec rm -rf {} + || true
          cd ..
          zip -rq "halcyon-${GITHUB_REF_NAME#v}.zip" halcyon
      - uses: softprops/action-gh-release@v2
        with:
          files: halcyon-*.zip
          generate_release_notes: true
