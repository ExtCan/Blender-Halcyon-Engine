name: Feature request
description: Something the engine should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do
    validations:
      required: true
  - type: input
    id: prior_art
    attributes:
      label: Which package did it, if any
      description: >
        Halcyon reproduces mid-to-late 1990s renderers. Naming the software that
        had the feature is the fastest way to get it built the right way.
      placeholder: "Bryce 3D's Deep Texture Editor"
